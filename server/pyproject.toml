[project]
name = "pc-control-mcp"
version = "0.3.0"
description = "Local Windows PC-control MCP server for Antigravity (real-time batched desktop GUI automation, input lock overlay, window management, clipboard, and system telemetry)."
readme = "../README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Aaditya Sharma" }]
dependencies = [
    "google-genai>=1.0.0",
    "mcp>=1.2.0",
    "mss>=9.0.0",
    "pillow>=10.0.0",
    "psutil>=5.9.0",
    "pyautogui>=0.9.54",
    "pyperclip>=1.9.0",
    "uiautomation>=2.0.20",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
